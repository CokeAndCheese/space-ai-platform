# Public HTTP release: no proxy route and no runtime credentials.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"space-ai-platform"}\n';
    }

    # Also blocks /space-ai-platform/api/* after Caddy strips the prefix.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /draco/ {
        try_files $uri =404;
        expires 30d;
    }
    location /models/ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
